<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <title>محلل درجات الطلاب</title>

</head>
<body>

        <label>Privilege:A</label>

        <label>Very good:B</label>

        <button id="analyzeBtn">View the result</button>

        <!-- منطقة عرض التقرير -->
